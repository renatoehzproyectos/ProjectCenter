org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# CI-friendly: avoid background daemons and flaky parallel work
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.workers.max=2

# Run Kotlin compiler in-process (avoids "daemon terminated unexpectedly" on GHA)
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
